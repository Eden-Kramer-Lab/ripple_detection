name: Test, Build, and Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run ruff formatting check
        run: ruff format --check ripple_detection/ tests/
      - name: Run ruff linting
        run: ruff check ripple_detection/ tests/ --output-format=github
      - name: Run mypy type checking
        run: mypy ripple_detection/

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests with coverage
        run: pytest --cov=ripple_detection --cov-report=xml --cov-report=term-missing tests/
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Test notebooks
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .[examples]
          jupyter nbconvert --to notebook --ExecutePreprocessor.kernel_name=python3 --execute examples/detection_examples.ipynb
          jupyter nbconvert --to notebook --ExecutePreprocessor.kernel_name=python3 --execute examples/test_individual_algorithm_components.ipynb
          jupyter nbconvert --to notebook --ExecutePreprocessor.kernel_name=python3 --execute examples/ripple_detection_tutorial.ipynb

  test-minimum-pins:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the floors pyproject.toml declares
        run: |
          pip install "numpy==1.24.*" "scipy==1.10.*" "pandas==2.0.*"
          pip install --no-deps -e .
          pip install pytest pytest-cov hypothesis pytest-snapshot
      - name: Run tests
        run: pytest tests/ --no-cov

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, test, test-minimum-pins]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs to determine version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-package:
    name: Test ${{ matrix.package }} install
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        package: ['wheel', 'sdist']
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel
        if: matrix.package == 'wheel'
        run: pip install dist/*.whl
      - name: Install sdist
        if: matrix.package == 'sdist'
        run: pip install dist/*.tar.gz
      - name: Smoke-test the installed package
        # exercises the two data files the wheel force-includes (the filter
        # kernel and the literature survey) and one detector end to end
        run: |
          python - <<'EOF'
          import numpy as np
          import ripple_detection as rd
          print("Version:", rd.__version__)
          fs = 1500
          time = np.arange(0, 20, 1 / fs)
          lfp = np.column_stack([rd.simulate_LFP(time, [3.0, 9.0], random_state=s) for s in (1, 2)])
          filtered = rd.filter_ripple_band(lfp, fs)  # loads ripplefilter.mat
          events = rd.Kay_ripple_detector(time, filtered, np.full(len(time), 2.0), fs)
          assert len(events) == 2, len(events)
          assert rd.load_literature_parameters().shape == (57, 35)
          spec = rd.get_detector("Kay_ripple_detector")
          spec.check_inputs(filtered)
          spec.check_parameters(spec.parameters)
          print("smoke test passed")
          EOF

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/ripple-detection/
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          # Extract section between this version and next version marker
          sed -n '/## \[${{ steps.get_version.outputs.VERSION }}\]/,/## \[/p' CHANGELOG.md | sed '$d' > release_notes.md
          # If extraction failed, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release v${{ steps.get_version.outputs.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
