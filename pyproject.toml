[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27: PEP 639 license expressions
build-backend = "hatchling.build"

[project]
name = "ripple_detection"
dynamic = ["version"]
description = "Tools for finding sharp-wave ripple events (150-250 Hz) from local field potentials."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Eric Denovellis", email = "edeno@bu.edu" }]
keywords = ["neuroscience", "hippocampus", "ripple", "LFP", "sharp-wave"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
# `pip install -e .[dev,examples]`. Keep `dev` identical to the `dev` dependency
# group below, which `uv sync` installs by default.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.16,<0.17",  # ruff format output is stable within a minor version
    "mypy>=1.8.0",
]
examples = ["matplotlib>=3.5.0", "jupyter>=1.0.0", "jupyterlab>=3.0.0"]

[dependency-groups]
# `uv sync` installs the package in editable mode plus this group; add
# `--extra examples` for the notebooks. Keep identical to the `dev` extra above.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-snapshot>=0.9.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/Eden-Kramer-Lab/ripple_detection"
Repository = "https://github.com/Eden-Kramer-Lab/ripple_detection"
Issues = "https://github.com/Eden-Kramer-Lab/ripple_detection/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ripple_detection/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
# every file under the package ships, including ripplefilter.mat and the
# literature CSV; a force-include would also copy them into site-packages on
# an editable install, where they shadow the package for coverage
packages = ["src/ripple_detection"]

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=src/ripple_detection",
    "--cov-report=term-missing",
]
xfail_strict = true
log_level = "INFO"
# every warning is an error: a test that expects one says so with pytest.warns
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# by path: with the src layout, the module name resolves ambiguously between the
# project root and src on sys.path, and coverage then reports the package unmeasured
source = ["src/ripple_detection"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
files = ["src/ripple_detection"]
mypy_path = "src"
# Target 3.12 so mypy can parse NumPy's stubs, which use PEP 695 `type`
# statements (only valid for python_version >= 3.12). Runtime 3.10 support is
# verified by the test matrix.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
strict_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
allow_redefinition = true

# Disable specific checks that cause false positives with ArrayLike
[[tool.mypy.overrides]]
module = "ripple_detection.*"
disable_error_code = [
    "index",
    "operator",
    "union-attr",
    "arg-type",
    "assignment",
    "call-overload",
    "no-any-return",
]

[tool.ruff]
line-length = 95
exclude = [
    ".eggs",
    ".git",
    ".hatch",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
    "src/ripple_detection/_version.py", # Auto-generated by hatch-vcs
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
    "ARG",  # unused arguments
    "EM",   # exception messages assigned before the raise
    "EXE",  # shebangs
    "FURB", # refurb modernizations
    "G",    # logging format
    "ICN",  # import conventions
    "ISC",  # implicit string concatenation
    "PERF", # performance anti-patterns
    "PGH",  # pygrep hooks (blanket noqa, type: ignore without code)
    "PIE",  # misc lints
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return statements
    "SIM",  # simplifications
    "T20",  # print statements
    "YTT",  # sys.version misuse
]
ignore = [
    "E501",    # line too long (handled by ruff format)
    "ISC001",  # conflicts with the formatter
]


# Per-file ignores for notebooks
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "NPY002",  # Allow legacy np.random in notebooks for pedagogical simplicity
]
"tests/*" = ["ARG"]  # pytest fixtures are used by name, not by value
